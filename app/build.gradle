plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystoreAlias = System.getenv('ANDROID_KEY_ALIAS')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'io.github.ayuemin.texteditor'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ayuemin.texteditor'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0-prototype'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Experimental semantic classification. The transformer package itself is
    // optional and is not part of the deterministic editor readiness path.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
