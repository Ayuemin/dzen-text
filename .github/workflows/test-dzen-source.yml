name: Test official Dzen rules source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-dzen-source.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official source without OpenRouter
        run: |
          python3 - <<'PY'
          import hashlib
          from tools.update_dzen_rules import fetch_official_text, SOURCE_URL
          text=fetch_official_text(SOURCE_URL)
          print('Official source OK')
          print('characters:', len(text))
          print('sha256:', hashlib.sha256(text.encode('utf-8')).hexdigest())
          print('No article data and no OpenRouter request were used in this test.')
          PY
