name: Finalize checklist cleanup

on:
  push:
    branches:
      - fix/ai-check-workflow-audit
    paths:
      - .github/workflows/finalize-checklist.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-check-workflow-audit
          fetch-depth: 0

      - name: Prepare cleanup script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_checklist_cleanup.py')
          s=p.read_text(encoding='utf-8')
          old="wf = remove_assigned_function(wf, 'updateMarkdownToolbarVisibility')\nwf = remove_function(wf, 'hideSettingsGroupFor')\nwf = remove_function(wf, 'applyWorkflowUiPolicy')"
          new="wf = remove_function(wf, 'hideSettingsGroupFor')\nwf = remove_function(wf, 'applyWorkflowUiPolicy')\nwf = remove_assigned_function(wf, 'updateMarkdownToolbarVisibility')"
          if old not in s:
              raise SystemExit('cleanup ordering marker not found')
          s=s.replace(old,new,1)
          old="m = re.search(r'(?m)^(?:async\\s+)?function\\s+' + re.escape(name) + r'\\s*\\(', text)"
          new="m = re.search(r'(?m)^[ \\t]*(?:async\\s+)?function\\s+' + re.escape(name) + r'\\s*\\(', text)"
          if old not in s:
              raise SystemExit('function parser marker not found')
          s=s.replace(old,new,1)
          marker='# Physical absence checks before tests.'
          inject="p = JS / '02-text-tools.js'\ntt = p.read_text(encoding='utf-8')\ntt = tt.replace('value.dzenCheckMode=normalizeDzenCheckMode(value.dzenCheckMode);', '')\np.write_text(tt, encoding='utf-8')\n\n"
          if marker not in s:
              raise SystemExit('physical absence marker not found')
          s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply final source cleanup
        shell: bash
        run: |
          set +e
          python3 tools/finalize_checklist_cleanup.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '--- residual retired references ---'
            grep -R -n --exclude='finalize_checklist_cleanup.py' -E 'dzenCheckMode|markdownToolbarSwitch|normalizeDzenCheckMode|checkModeUsesLocal|checkModeUsesAi' app/src/main/assets/www || true
            exit "$rc"
          fi

      - name: Finalize invariant paths and retired hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tools/check_editor_invariants.py')
          s=p.read_text(encoding='utf-8')
          old='workflow = (JS / "12-markdown-toolbar.js").read_text(encoding="utf-8")'
          new='workflow = (JS / "12-workflow-policy.js").read_text(encoding="utf-8")'
          if old not in s:
              raise SystemExit('old invariant workflow path not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('tools/check_app_logic.py')
          s=p.read_text(encoding='utf-8')
          old='["07-spelling.js", "08-navigation.js", "11-ui.js", "12-markdown-toolbar.js"]'
          new='["07-spelling.js", "08-navigation.js", "11-ui.js", "12-workflow-policy.js"]'
          if old not in s:
              raise SystemExit('old app logic workflow filename not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('app/src/main/assets/www/js/10-ai-dzen.js')
          s=p.read_text(encoding='utf-8')
          old="function shouldRunAiDzenCheck(){\n  return checkModeUsesAi();\n}"
          new="function shouldRunAiDzenCheck(){\n  return true;\n}"
          if old not in s:
              raise SystemExit('legacy AI mode helper body not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('app/src/main/assets/www/js/12-history.js')
          s=p.read_text(encoding='utf-8')
          old="function updateHistoryButtons(){\n  const undo=document.getElementById('undoBtn');\n  const redo=document.getElementById('redoBtn');\n  if(undo)undo.disabled=!undoStack.length;\n  if(redo)redo.disabled=!redoStack.length;\n}"
          new="function updateHistoryButtons(){}"
          if old not in s:
              raise SystemExit('obsolete history button hook not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Check JavaScript and regression suite
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
          python3 tools/check_editor_invariants.py
          python3 tools/check_app_logic.py
          node tools/test_publish_export.js
          node tools/test_publish_copy.js
          node tools/test_ai_dzen_flow.js

      - name: Commit finalized sources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-checklist.yml
          rm tools/finalize_checklist_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete analysis workflow cleanup"
          git push origin HEAD:fix/ai-check-workflow-audit
