name: Finalize checklist cleanup

on:
  push:
    branches:
      - fix/ai-check-workflow-audit
    paths:
      - .github/workflows/finalize-checklist.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-check-workflow-audit
          fetch-depth: 0

      - name: Prepare cleanup script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_checklist_cleanup.py')
          s=p.read_text(encoding='utf-8')
          old="wf = remove_assigned_function(wf, 'updateMarkdownToolbarVisibility')\nwf = remove_function(wf, 'hideSettingsGroupFor')\nwf = remove_function(wf, 'applyWorkflowUiPolicy')"
          new="wf = remove_function(wf, 'hideSettingsGroupFor')\nwf = remove_function(wf, 'applyWorkflowUiPolicy')\nwf = remove_assigned_function(wf, 'updateMarkdownToolbarVisibility')"
          if old not in s:
              raise SystemExit('cleanup ordering marker not found')
          s=s.replace(old,new,1)
          old="m = re.search(r'(?m)^(?:async\\s+)?function\\s+' + re.escape(name) + r'\\s*\\(', text)"
          new="m = re.search(r'(?m)^[ \\t]*(?:async\\s+)?function\\s+' + re.escape(name) + r'\\s*\\(', text)"
          if old not in s:
              raise SystemExit('function parser marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply final source cleanup
        shell: bash
        run: |
          set +e
          python3 tools/finalize_checklist_cleanup.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '--- residual dzenCheckMode references ---'
            grep -R -n --exclude='finalize_checklist_cleanup.py' 'dzenCheckMode' app/src/main/assets/www || true
            exit "$rc"
          fi

      - name: Check JavaScript and regression suite
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
          python3 tools/check_editor_invariants.py
          python3 tools/check_app_logic.py
          node tools/test_publish_export.js
          node tools/test_publish_copy.js
          node tools/test_ai_dzen_flow.js

      - name: Commit finalized sources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-checklist.yml
          rm tools/finalize_checklist_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete analysis workflow cleanup"
          git push origin HEAD:fix/ai-check-workflow-audit
