name: Implement Dzen Text v1.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-v150.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.5.0 patch
        run: python3 .github/scripts/v150_patch.py

      - name: Check JavaScript and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/dzen.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dzen.js
          grep -q "versionCode 21" app/build.gradle
          grep -q "versionName '1.5.0'" app/build.gradle
          grep -q "runFullCheck" app/src/main/assets/www/index.html
          grep -q "AndroidSpell" app/src/main/java/ru/dzenprep/texteditor/MainActivity.java

      - name: Commit and tag v1.5.0
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/www/index.html app/src/main/java/ru/dzenprep/texteditor/MainActivity.java
          git commit -m "Add full proofreading check with optional Yandex Speller (v1.5.0)"
          git push origin main
          git tag -a v1.5.0 -m "Дзен Текст v1.5.0 — полная проверка текста"
          git push origin v1.5.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dzen-text-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dzen-text-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Dzen-Text-v1.5.0.apk
          gh release create v1.5.0 Dzen-Text-v1.5.0.apk --title "Дзен Текст v1.5.0" --notes "Добавлена кнопка полной проверки текста без подписи. Она запускает все включённые локальные проверки и, если пользователь разрешил это в настройках, онлайн-проверку орфографии через Яндекс.Спеллер. Онлайн-проверка по умолчанию выключена и выполняется только после явного нажатия кнопки. Вставленный из буфера или загруженный из файла текст по-прежнему автоматически проходит локальный анализ. Добавлены локальные проверки пробелов, повторов слов, пунктуации и смешения кириллицы/латиницы, а найденные орфографические ошибки можно исправлять из предложенных вариантов."
