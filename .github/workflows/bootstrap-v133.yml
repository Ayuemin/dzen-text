# rerun after Gradle signing fix
name: Bootstrap permanent signed v1.3.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v133.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dzen-text-release.jks"
          test -s "$RUNNER_TEMP/dzen-text-release.jks"

      - name: Build permanently signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dzen-text-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$ANDROID_KEY_ALIAS" = "dzen-text"
          grep -q "versionCode 16" app/build.gradle
          grep -q "versionName '1.3.3'" app/build.gradle
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and permanent certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_INFO"
          NORMALIZED=$(printf '%s' "$CERT_INFO" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "$NORMALIZED" | grep -q '0fd2d2518979f8db3ff5ccd6da29669a3e8de10fbcc35156de8396d3dba3f2b2'

      - name: Create v1.3.3 tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          if git rev-parse v1.3.3 >/dev/null 2>&1; then
            echo "Tag v1.3.3 already exists"
          else
            git tag -a v1.3.3 -m "Дзен Текст v1.3.3 — первая версия с постоянным ключом подписи"
            git push origin v1.3.3
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" Dzen-Text-v1.3.3.apk
          if gh release view v1.3.3 >/dev/null 2>&1; then
            gh release upload v1.3.3 Dzen-Text-v1.3.3.apk --clobber
          else
            gh release create v1.3.3 Dzen-Text-v1.3.3.apk \
              --title "Дзен Текст v1.3.3" \
              --notes "Первая версия Дзен Текст, подписанная постоянным release-ключом. После перехода на эту версию все будущие APK из этого репозитория смогут устанавливаться как обычные обновления. Функционально основана на v1.3.2."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Dzen-Text-v1.3.3-permanent-signed
          path: Dzen-Text-v1.3.3.apk
