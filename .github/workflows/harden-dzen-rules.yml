name: Harden Dzen rules generator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-dzen-rules.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden generator and sanitize current database
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('tools/update_dzen_rules.py')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch marker not found: {label}')
              s = s.replace(old, new, 1)

          rep('PRIMARY_MODEL = os.getenv("DZEN_RULES_MODEL", "openai/gpt-oss-20b:free")',
              'PRIMARY_MODEL = os.getenv("DZEN_RULES_MODEL", "openrouter/free")', 'default free model')
          rep('PROMPT_VERSION = 2', 'PROMPT_VERSION = 3', 'prompt version')

          old_prompt = '''7. Все строки — на русском, кроме технических id в snake_case.\n"""'''
          new_prompt = '''7. Все строки — на русском, кроме технических id в snake_case.
8. phrases — только высокоточные сигналы. Нейтральное упоминание темы само по себе не должно давать предупреждение. Не помещай в phrases обычные формулировки вроде указания источника, доказательной медицины, призыва подписаться/поставить лайк или бесплатного курса, если сам официальный источник прямо не объявляет именно такую формулировку нарушением.
9. Не пытайся автоматически определять неоригинальность, внешние дубли и авторские права по словам внутри статьи: такие пункты отправляй в manual_checks.
10. stems должны быть достаточно специфичными. Не используй основы короче 4 символов и обычные куски распространённых слов. Запрещены двусмысленные основы вроде «тот», «бот», «бад».
11. Для кликбейта используй scope=title, если официальный текст описывает проблему заголовка/карточки. Для широких тематических категорий предпочитай min_score 3–4.
12. Лучше пропустить слабый сигнал, чем сделать базу, которая красит обычный безопасный текст. База должна помогать автору, а не пугать ложными совпадениями.
"""'''
          rep(old_prompt, new_prompt, 'prompt guardrails')

          marker = '''def validate_and_wrap(generated: dict, source_hash: str, model_used: str) -> dict:\n'''
          guard = r'''
NEUTRAL_PHRASES = {
    "доказательная медицина", "назначение лекарств", "народная медицина",
    "источник:", "подлинная история", "подпишитесь на канал", "ставьте лайк",
    "бесплатный курс"
}
DROP_STEMS = {"тот", "бот", "бад"}
MANUAL_DEFAULTS = [
    "Неоригинальный или дублированный контент — для надёжной проверки нужны внешние публикации, а не слова внутри статьи.",
    "Авторские права на текст, изображения и видео — автоматически по тексту статьи не определяются.",
    "Достоверность фактических утверждений — требует сверки с внешними источниками.",
    "Соответствие заголовка содержанию — локальная эвристика видит отдельные признаки, но не понимает весь смысл статьи."
]
TITLE_OVERRIDES = {
    "azartnye_igry": "Азартные игры — проверить контекст",
    "nenavist_nasilie": "Вражда или насилие — проверить контекст",
    "iskusstvennye_pokazateli": "Искусственная активность — проверить",
    "klikbeit": "Возможный кликбейт",
    "medicina": "Медицинские рекомендации — проверить",
    "nezakonnaya_informaciya": "Потенциально незаконная информация — проверить",
    "otkrovennyy_kontent": "Откровенный контент — проверить",
    "proisshestviya_tragedii": "Трагический контент — проверить",
    "spam": "Возможный спам или навязчивый призыв",
    "shok_kontent": "Шокирующий контент — проверить"
}


def apply_guardrails(cat: dict) -> dict | None:
    ident = str(cat.get("id", ""))
    low_id = ident.lower()
    if any(x in low_id for x in ("neoriginal", "duplicate", "dubl", "copyright")):
        return None
    cat = dict(cat)
    cat["phrases"] = [x for x in clean_list(cat.get("phrases")) if x not in NEUTRAL_PHRASES]
    cat["stems"] = [x for x in clean_list(cat.get("stems"), max_len=40) if len(x) >= 4 and x not in DROP_STEMS]
    cat["action_words"] = clean_list(cat.get("action_words"), max_len=60)
    cat["context_words"] = clean_list(cat.get("context_words"), max_len=60)
    cat["exclude_words"] = clean_list(cat.get("exclude_words"), max_len=100)
    cat["min_score"] = max(3, min(5, int(cat.get("min_score", 3))))
    if low_id in {"medicina", "spam", "proisshestviya_tragedii", "shok_kontent"}:
        cat["min_score"] = max(4, cat["min_score"])
    if "klik" in low_id or "clickbait" in low_id:
        cat["scope"] = "title"
    if ident in TITLE_OVERRIDES:
        cat["title"] = TITLE_OVERRIDES[ident]
    if not cat["phrases"] and not cat["stems"]:
        return None
    return cat


def add_manual_defaults(items) -> list[str]:
    out = []
    for x in list(items or []) + MANUAL_DEFAULTS:
        text = re.sub(r"\s+", " ", str(x)).strip()[:260]
        if text and text not in out:
            out.append(text)
    return out[:20]

'''
          rep(marker, guard + marker, 'guardrail functions')

          old_append = '''        if cat["phrases"] or cat["stems"]:\n            categories.append(cat)'''
          new_append = '''        cat = apply_guardrails(cat)\n        if cat:\n            categories.append(cat)'''
          rep(old_append, new_append, 'apply generated guardrails')

          old_manual = '''    title_limit = int(generated.get("article_title_max_chars") or 0)'''
          new_manual = '''    manual = add_manual_defaults(manual)\n    title_limit = int(generated.get("article_title_max_chars") or 0)'''
          rep(old_manual, new_manual, 'manual defaults')

          old_gen = '''            "prompt_version": PROMPT_VERSION,\n        },'''
          new_gen = '''            "prompt_version": PROMPT_VERSION,\n            "guardrails_version": 1,\n        },'''
          rep(old_gen, new_gen, 'guardrails metadata')

          p.write_text(s, encoding='utf-8')

          # Sanitize the database generated a moment ago without another OpenRouter request.
          import importlib.util
          spec = importlib.util.spec_from_file_location('dzen_updater', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          rp = Path('rules/dzen-rules.json')
          db = json.loads(rp.read_text(encoding='utf-8'))
          clean_cats = []
          for cat in db.get('categories', []):
              c = mod.apply_guardrails(cat)
              if c:
                  clean_cats.append(c)
          if len(clean_cats) < 3:
              raise SystemExit('Guardrails removed too many categories')
          db['categories'] = clean_cats
          db['manual_checks'] = mod.add_manual_defaults(db.get('manual_checks', []))
          db.setdefault('generator', {})['guardrails_version'] = 1
          db['note'] = 'Локальная контекстная эвристика с защитой от ложных совпадений. Сигнал означает повод проверить фрагмент, а не установленное нарушение.'
          rp.write_text(json.dumps(db, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Static checks.
          assert db.get('schema') == 2
          assert len(db['categories']) >= 3
          assert all('тот' not in c.get('stems', []) for c in db['categories'])
          assert all('бот' not in c.get('stems', []) for c in db['categories'])
          assert all('бад' not in c.get('stems', []) for c in db['categories'])
          assert not any(c.get('id') == 'neoriginalnyy_kontent' for c in db['categories'])
          assert next(c for c in db['categories'] if c.get('id') == 'klikbeit')['scope'] == 'title'
          assert 'доказательная медицина' not in next(c for c in db['categories'] if c.get('id') == 'medicina')['phrases']
          print('Hardened categories:', len(db['categories']))
          print('Manual checks:', len(db['manual_checks']))
          PY

      - name: Syntax check updater
        run: python3 -m py_compile tools/update_dzen_rules.py

      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/update_dzen_rules.py rules/dzen-rules.json
          git commit -m 'Harden Dzen rules against false positives'
          git push origin main
