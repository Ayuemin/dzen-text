name: Harden Dzen rules generator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-dzen-rules.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden generator and sanitize current database
        run: python3 .github/harden_dzen_rules.py

      - name: Syntax check updater
        run: python3 -m py_compile tools/update_dzen_rules.py

      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/update_dzen_rules.py rules/dzen-rules.json
          git commit -m 'Harden Dzen rules against false positives'
          git push origin main
