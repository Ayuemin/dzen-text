name: Implement nearby repeat view v1.3.5 fixed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-nearby-v135-fixed.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          d=lambda x: base64.b64decode(x).decode('utf-8')
          p=Path('app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('anchor not found: '+label)
              s=s.replace(old,new,1)
          rep('<title>Дзен Текст 1.3.4</title>','<title>Дзен Текст 1.3.5</title>','title')
          ca=d('LmZpbGVJbnB1dHtkaXNwbGF5Om5vbmV9LmRpY3RTdGF0dXN7Zm9udC1zaXplOjEycHg7Y29sb3I6dmFyKC0tbXV0ZWQpO21hcmdpbjo3cHggMCA4cHh9LmRpY3RTdGF0dXMgYntjb2xvcjp2YXIoLS10ZXh0KX0=')
          ci=d('')
          rep(ca,ci+ca,'css')
          ma=d('')
          mi=d('')
          rep(ma,mi,'markup')
          on=d('')
          nn=d('')
          rep(on,nn,'nearby logic')
          oi=d('')
          ni=d('')
          rep(oi,ni,'issue click')
          ja=d('')
          hp=d('')
          rep(ja,hp+ja,'helpers')
          rep("editor.addEventListener('input',()=>{if(replacementState)closeReplacement();render()});","editor.addEventListener('input',()=>{if(replacementState)closeReplacement();if(nearbyState)closeNearbyRepeat();render()});",'input')
          rep("stopSpeak();closeReplacement();editor.value='';","stopSpeak();closeReplacement();closeNearbyRepeat();editor.value='';",'clear')
          rep("closeReplacement();render();showPane('edit');editor.focus();toast(name?`Загружен файл: ${name}`:'Текст загружен из файла')","closeReplacement();closeNearbyRepeat();render();showPane('edit');editor.focus();toast(name?`Загружен файл: ${name}`:'Текст загружен из файла')",'load')
          p.write_text(s,encoding='utf-8')
          g=Path('app/build.gradle')
          b=g.read_text(encoding='utf-8')
          if "versionCode 17" not in b or "versionName '1.3.4'" not in b:
              raise SystemExit('unexpected version')
          g.write_text(b.replace('versionCode 17','versionCode 18',1).replace("versionName '1.3.4'","versionName '1.3.5'",1),encoding='utf-8')
          PY

      - name: Check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')+8
          b=s.rfind('</script>')
          Path('/tmp/dzen.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dzen.js
          grep -q "versionName '1.3.5'" app/build.gradle
          grep -q 'openNearbyRepeat' app/src/main/assets/www/index.html

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/www/index.html
          git commit -m "Show both nearby repeat occurrences (v1.3.5)"
          git push origin main
          git tag -a v1.3.5 -m "Дзен Текст v1.3.5 — наглядные повторы рядом"
          git push origin v1.3.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dzen-text-release.jks"
      - name: Build release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dzen-text-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          NORMALIZED=$(printf '%s' "$CERT_INFO" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "$NORMALIZED" | grep -q '0fd2d2518979f8db3ff5ccd6da29669a3e8de10fbcc35156de8396d3dba3f2b2'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Dzen-Text-v1.3.5.apk
          gh release create v1.3.5 Dzen-Text-v1.3.5.apk --title "Дзен Текст v1.3.5" --notes "Улучшены «Повторы рядом»: приложение показывает два соседних предложения и подчёркивает повторяющееся слово в обоих местах. Можно перейти к любому из двух употреблений и открыть замену."
