name: Prototype transform run

on:
  push:
    branches:
      - prototype/editorial-rule-packs

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prototype/editorial-rule-packs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Transform app
        run: python3 tools/build_editorial_prototype.py
      - name: Validate JavaScript syntax
        run: |
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
      - name: Commit prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "prototype: neutral editor with local rule packs" || exit 0
          git push origin HEAD:prototype/editorial-rule-packs
