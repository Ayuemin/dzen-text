name: Apply physical local-first cleanup

on:
  push:
    branches:
      - local-first-v1.9

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Apply physical local-first cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local-first-v1.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic cleanup
        run: python3 .github/scripts/apply_local_first_cleanup.py

      - name: Verify cleanup changed the intended sources
        run: |
          git diff --check
          python3 tools/check_local_first.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/dzenprep/texteditor/MainActivity.java \
                  app/src/main/assets/www/index.html \
                  app/src/main/assets/www/js/01-core.js \
                  app/src/main/assets/www/js/04-dzen-analysis.js \
                  app/src/main/assets/www/js/05-analysis-state.js \
                  app/src/main/assets/www/js/06-analysis-report.js \
                  app/src/main/assets/www/js/07-spelling.js \
                  app/src/main/assets/www/js/09-editor.js \
                  app/src/main/assets/www/js/10-settings.js \
                  app/src/main/assets/www/js/12-bootstrap.js \
                  tools/check_local_first.py
          git commit -m 'Apply physical local-first cleanup'
          git push origin HEAD:local-first-v1.9
