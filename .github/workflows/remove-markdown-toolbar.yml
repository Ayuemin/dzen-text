name: Remove retired Markdown toolbar

on:
  push:
    branches:
      - local-first-v1.9

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove retired Markdown toolbar UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local-first-v1.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply cleanup
        run: python3 .github/scripts/remove_markdown_toolbar.py

      - name: Validate local editor
        run: |
          git diff --check
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
          python3 tools/check_local_first.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No Markdown toolbar cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/main/assets/www tools/check_local_first.py
          git commit -m 'Remove retired Markdown toolbar UI'
          git push origin HEAD:local-first-v1.9
