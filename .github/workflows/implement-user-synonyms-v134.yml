name: Implement custom synonym accumulator v1.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-user-synonyms-v134.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch editor and bump version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch anchor not found: {label}')
              s = s.replace(old, new, 1)

          replace_once('<title>Дзен Текст 1.3.2</title>', '<title>Дзен Текст 1.3.4</title>', 'HTML title')

          replace_once(
              '<div id="dictStatus" class="dictStatus">Встроенный словарь загружается…</div>\n    <div class="settingActions"><button class="nativeBtn" type="button" onclick="chooseSynonymDictionary()">Импортировать свой</button><button class="nativeBtn" type="button" onclick="clearSynonymDictionary()">Удалить внешний</button></div>',
              '<div id="dictStatus" class="dictStatus">Встроенный словарь загружается…</div>\n    <div id="userSynonymStatus" class="dictStatus">Свои синонимы: пока нет</div>\n    <details style="margin:8px 0"><summary>Мои накопленные синонимы</summary><div id="userSynonymList" class="smallNote" style="max-height:130px;overflow:auto;white-space:pre-line">Пока пусто.</div></details>\n    <div class="settingActions"><button class="nativeBtn" type="button" onclick="chooseSynonymDictionary()">Импортировать свой</button><button class="nativeBtn" type="button" onclick="clearSynonymDictionary()">Удалить внешний</button><button class="nativeBtn" type="button" onclick="clearUserSynonyms()">Очистить накопленные</button></div>\n    <div class="smallNote">Замена, введённая вручную в поле «Своя замена», автоматически запоминается для этого слова и в следующий раз показывается первой. Эти пары не удаляются при очистке текста и сохраняются при обновлении приложения.</div>',
              'synonym settings UI')

          replace_once(
              "let settings=loadSettings(); let speaking=false; let saveTimer=null; let currentAnalysis={issues:[],warningCount:0,metrics:{}};",
              "let settings=loadSettings(); let speaking=false; let saveTimer=null; let currentAnalysis={issues:[],warningCount:0,metrics:{}};\nconst USER_SYNONYMS_KEY='dzenUserSynonymsV1';\nlet userSynonyms=loadUserSynonyms();",
              'custom synonym state')

          marker = "function preserveCase(src,repl){if(!repl)return repl;if(src===src.toUpperCase()&&/[A-Za-zА-Яа-яЁё]/.test(src))return repl.toUpperCase();if(src[0]&&src[0]===src[0].toUpperCase())return repl.charAt(0).toUpperCase()+repl.slice(1);return repl}"
          helpers = r'''function loadUserSynonyms(){try{const raw=JSON.parse(localStorage.getItem(USER_SYNONYMS_KEY)||'{}');if(!raw||typeof raw!=='object'||Array.isArray(raw))return {};const out={};for(const [k,v] of Object.entries(raw)){if(!Array.isArray(v))continue;const key=String(k||'').trim().toLocaleLowerCase('ru-RU');if(!key)continue;out[key]=v.map(x=>String(x||'').trim()).filter(Boolean).slice(0,20)}return out}catch(e){return {}}}
function userSynonymPairCount(){return Object.values(userSynonyms).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function saveUserSynonyms(){try{localStorage.setItem(USER_SYNONYMS_KEY,JSON.stringify(userSynonyms))}catch(e){}updateUserSynonymStatus()}
function rememberUserSynonym(source,replacement){const key=String(source||'').trim().toLocaleLowerCase('ru-RU'),val=String(replacement||'').trim();if(!key||!val||key===val.toLocaleLowerCase('ru-RU'))return;let arr=Array.isArray(userSynonyms[key])?userSynonyms[key].slice():[];arr=arr.filter(x=>String(x).toLocaleLowerCase('ru-RU')!==val.toLocaleLowerCase('ru-RU'));arr.unshift(val);userSynonyms[key]=arr.slice(0,20);saveUserSynonyms()}
function updateUserSynonymStatus(){const status=document.getElementById('userSynonymStatus'),list=document.getElementById('userSynonymList');if(!status&&!list)return;const pairs=[];for(const key of Object.keys(userSynonyms).sort((a,b)=>a.localeCompare(b,'ru'))){for(const v of userSynonyms[key]||[])pairs.push([key,v])}if(status)status.innerHTML=pairs.length?`Свои синонимы: <b>${pairs.length}</b> ${pairs.length%10===1&&pairs.length%100!==11?'пара':'пар'}`:'Свои синонимы: пока нет';if(list)list.textContent=pairs.length?pairs.slice(0,80).map(([k,v])=>`${k} → ${v}`).join('\n')+(pairs.length>80?`\n…ещё ${pairs.length-80}`:''):'Пока пусто.'}
function clearUserSynonyms(){const n=userSynonymPairCount();if(!n){toast('Накопленных синонимов пока нет');return}if(!confirm(`Удалить накопленные синонимы (${n})?`))return;userSynonyms={};try{localStorage.removeItem(USER_SYNONYMS_KEY)}catch(e){}updateUserSynonymStatus();if(replacementState)renderReplacement();toast('Накопленные синонимы удалены')}
'''
          replace_once(marker, helpers + marker, 'custom synonym helper functions')

          old_suggestions = "function suggestionsForWord(word){const lower=word.toLocaleLowerCase('ru-RU'),out=[];const add=x=>{if(x&&x.toLocaleLowerCase('ru-RU')!==lower&&!out.some(y=>y.toLocaleLowerCase('ru-RU')===x.toLocaleLowerCase('ru-RU')))out.push(x)};(synonymForms[lower]||[]).forEach(add);let matched=null,ext=[];for(const k of lemmaCandidates(lower)){const arr=externalDictLookup(k);if(arr&&arr.length){matched=k;ext=arr;break}}if(matched)ext.forEach(x=>add(adaptExternalForm(lower,matched,String(x).trim())));return out.map(x=>preserveCase(word,x)).slice(0,10)}"
          new_suggestions = "function suggestionsForWord(word){const lower=word.toLocaleLowerCase('ru-RU'),out=[];const add=x=>{if(x&&x.toLocaleLowerCase('ru-RU')!==lower&&!out.some(y=>y.toLocaleLowerCase('ru-RU')===x.toLocaleLowerCase('ru-RU')))out.push(x)};(userSynonyms[lower]||[]).forEach(add);(synonymForms[lower]||[]).forEach(add);let matched=null,ext=[];for(const k of lemmaCandidates(lower)){const arr=externalDictLookup(k);if(arr&&arr.length){matched=k;ext=arr;break}}if(matched)ext.forEach(x=>add(adaptExternalForm(lower,matched,String(x).trim())));return out.map(x=>preserveCase(word,x)).slice(0,10)}"
          replace_once(old_suggestions, new_suggestions, 'suggestion priority')

          replace_once(
              "function applyManualReplacement(){const v=document.getElementById('manualReplacement').value.trim();if(v)applyReplacement(v)}",
              "function applyManualReplacement(){const v=document.getElementById('manualReplacement').value.trim();if(v&&replacementState){const current=editor.value.slice(replacementState.start,replacementState.end)||replacementState.original;rememberUserSynonym(current,v);applyReplacement(v)}}",
              'manual replacement learning')

          replace_once(
              "applyVisualSettings();if(settings.autosave){const d=localStorage.getItem('dzenDraft');if(d)editor.value=d}syncSettingsUI();render();setTimeout(updateDictStatus,80);setTimeout(updateDictStatus,800);",
              "applyVisualSettings();if(settings.autosave){const d=localStorage.getItem('dzenDraft');if(d)editor.value=d}syncSettingsUI();updateUserSynonymStatus();render();setTimeout(updateDictStatus,80);setTimeout(updateDictStatus,800);",
              'initial custom synonym status')

          p.write_text(s, encoding='utf-8')

          g = Path('app/build.gradle')
          b = g.read_text(encoding='utf-8')
          if "versionCode 16" not in b or "versionName '1.3.3'" not in b:
              raise SystemExit('Unexpected current Android version')
          b = b.replace('versionCode 16', 'versionCode 17', 1).replace("versionName '1.3.3'", "versionName '1.3.4'", 1)
          g.write_text(b, encoding='utf-8')
          PY

      - name: Syntax-check embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          if start < len('<script>') or end <= start:
              raise SystemExit('script block not found')
          Path('/tmp/dzen-app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/dzen-app.js
          grep -q "versionCode 17" app/build.gradle
          grep -q "versionName '1.3.4'" app/build.gradle
          grep -q "USER_SYNONYMS_KEY" app/src/main/assets/www/index.html
          grep -q "rememberUserSynonym(current,v)" app/src/main/assets/www/index.html

      - name: Commit v1.3.4 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/www/index.html
          git commit -m "Add persistent custom synonym accumulator (v1.3.4)"
          git push origin main

      - name: Tag v1.3.4
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          git tag -a v1.3.4 -m "Дзен Текст v1.3.4 — накопитель своих синонимов"
          git push origin v1.3.4
