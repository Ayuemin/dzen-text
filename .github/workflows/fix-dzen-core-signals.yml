name: Fix Dzen core signals v1.6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dzen-core-signals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Dzen checks
        run: python3 .github/fix_dzen_161.py

      - name: Commit and tag v1.6.1
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/www/index.html app/build.gradle
          git commit -m 'Fix Dzen profanity and clickbait checks'
          git push origin main
          git tag -a v1.6.1 -m 'Dzen Text v1.6.1'
          git push origin v1.6.1
