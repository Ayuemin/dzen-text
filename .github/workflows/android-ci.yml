name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Check editor JavaScript
        run: |
          for file in app/src/main/assets/www/js/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          js = "\n".join(p.read_text(encoding="utf-8") for p in sorted(Path("app/src/main/assets/www/js").glob("*.js")))
          handlers = set(re.findall(r'onclick="([A-Za-z_$][\w$]*)\s*\(', html))
          missing = sorted(name for name in handlers if not re.search(rf'(?:function\s+{re.escape(name)}\s*\(|(?:window\.)?{re.escape(name)}\s*=)', js))
          if missing:
              raise SystemExit("Missing onclick handlers: " + ", ".join(missing))
          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          if not scripts or scripts[-1] != "js/12-bootstrap.js":
              raise SystemExit("Bootstrap must be the final editor script")
          print(f"Checked {len(handlers)} static handlers and {len(scripts)} scripts")
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug and release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Dzen-Text-v1.9.0-test5-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
