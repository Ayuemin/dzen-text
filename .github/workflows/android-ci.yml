name: Android CI

on:
  push:
    branches:
      - main
      - local-first-v1.9
      - prototype/editorial-rule-packs
      - prototype/editorial-rule-packs-full-tz
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare pinned Hunspell probe inputs
        run: bash tools/prepare_hunspell_probe.sh

      - name: Check editor JavaScript
        run: |
          for file in app/src/main/assets/www/js/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          js = "\n".join(p.read_text(encoding="utf-8") for p in sorted(Path("app/src/main/assets/www/js").glob("*.js")))
          handlers = set(re.findall(r'onclick="([A-Za-z_$][\w$]*)\s*\(', html))
          missing = sorted(name for name in handlers if not re.search(rf'(?:function\s+{re.escape(name)}\s*\(|(?:window\.)?{re.escape(name)}\s*=)', js))
          if missing:
              raise SystemExit("Missing onclick handlers: " + ", ".join(missing))
          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          if not scripts or scripts[-1] != "js/12-bootstrap.js":
              raise SystemExit("Bootstrap must be the final editor script")
          print(f"Checked {len(handlers)} static handlers and {len(scripts)} scripts")
          PY
          python3 tools/check_editor_invariants.py
          python3 tools/check_app_logic.py
          python3 tools/check_offline_editor.py
          python3 tools/check_p0_storage.py
          node tools/test_p0_foundation.js
          node tools/test_p0_import.js
          node tools/test_document_model.js
          node tools/test_rule_pack.js
          node tools/test_publish_export.js
          node tools/test_publish_copy.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build editor and spelling probes
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :spellprobe-morfologik:assembleDebug :spellprobe-hunspell:assembleDebug

      - name: Verify spelling probe payloads
        shell: bash
        run: |
          MORF=spellprobe-morfologik/build/outputs/apk/debug/spellprobe-morfologik-debug.apk
          HUN=spellprobe-hunspell/build/outputs/apk/debug/spellprobe-hunspell-debug.apk
          unzip -l "$MORF" | grep -E 'org/languagetool/resource/ru/hunspell/ru_RU\.(dict|info)' >/dev/null
          unzip -l "$HUN" | grep 'assets/hunspell/ru_RU.aff' >/dev/null
          unzip -l "$HUN" | grep 'assets/hunspell/ru_RU.dic' >/dev/null
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$HUN" | grep "lib/$abi/libhunspell-probe.so" >/dev/null
          done
          echo "Spelling probe resources and ABIs verified"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Text-Editor-v${{ env.APP_VERSION }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Text-Editor-v${{ env.APP_VERSION }}-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Morfologik spelling probe APK
        uses: actions/upload-artifact@v4
        with:
          name: Spelling-Probe-Morfologik-2.2.0
          path: spellprobe-morfologik/build/outputs/apk/debug/spellprobe-morfologik-debug.apk
          if-no-files-found: error

      - name: Upload Hunspell spelling probe APK
        uses: actions/upload-artifact@v4
        with:
          name: Spelling-Probe-Hunspell-1.7.2
          path: spellprobe-hunspell/build/outputs/apk/debug/spellprobe-hunspell-debug.apk
          if-no-files-found: error
