name: Import Dzen Text v1.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v132.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Checkout temporary source branch
        uses: actions/checkout@v4
        with:
          repository: Ayuemin/Clickhack-Studio
          ref: dzen-text-v1.3-build
          path: source

      - name: Reconstruct Dzen Text v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dzen-src
          cat source/dzen-build/src.b64.part* | base64 -d | tar -xzf - -C /tmp/dzen-src
          PROJECT=/tmp/dzen-src/Dzen-Text-source-v1.3
          test -f "$PROJECT/settings.gradle"
          curl -fL --retry 3 https://raw.githubusercontent.com/egorkaru/synonym_dictionary/master/dictionary.json -o /tmp/abramov.json
          python3 source/dzen-build/patch-v131.py "$PROJECT" /tmp/abramov.json
          (cd "$PROJECT" && patch -p1 < "$GITHUB_WORKSPACE/source/dzen-build/v132.patch")
          grep -q "versionName '1.3.2'" "$PROJECT/app/build.gradle"
          test -s "$PROJECT/app/src/main/assets/synonyms_compact.json"

          rm -rf dest/app
          cp -a "$PROJECT/app" dest/app
          cp "$PROJECT/build.gradle" "$PROJECT/gradle.properties" "$PROJECT/settings.gradle" dest/

      - name: Add repository files and release configuration
        shell: bash
        working-directory: dest
        run: |
          set -euo pipefail
          mkdir -p docs licenses .github/workflows

          cat > .gitignore <<'EOF'
          .gradle/
          .idea/
          *.iml
          local.properties
          /build/
          **/build/
          .cxx/
          .externalNativeBuild/
          captures/
          *.jks
          *.keystore
          keystore.properties
          .DS_Store
          Thumbs.db
          EOF
          sed -i 's/^          //' .gitignore

          cat > THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-party notices

          ## Russian synonym dictionary

          The application bundles a compact derivative of the open-source repository `egorkaru/synonym_dictionary`.

          - Repository author/copyright holder: Egor Rudinsky
          - License: MIT
          - Dictionary content: based on N. Abramov's Russian synonym dictionary

          The original repository's MIT license is preserved in `licenses/synonym_dictionary-MIT.txt`.
          The bundled runtime file is `app/src/main/assets/synonyms_compact.json`.
          EOF
          sed -i 's/^          //' THIRD_PARTY_NOTICES.md

          cat > licenses/synonym_dictionary-MIT.txt <<'EOF'
          MIT License

          Copyright (c) 2017 Egor Rudinsky

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          sed -i 's/^          //' licenses/synonym_dictionary-MIT.txt

          cat > docs/BUILD_AND_RELEASE.md <<'EOF'
          # Сборка и выпуск APK

          ## Локальная сборка

          Нужны Java 17, Android SDK 35 и Gradle 8.10.x.

          ```bash
          gradle :app:assembleDebug
          gradle :app:assembleRelease
          ```

          ## Подпись release APK

          Не храните `.jks` или `.keystore` в репозитории.

          Проект читает параметры подписи из переменных окружения:

          - `ANDROID_KEYSTORE_PATH`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_PASSWORD`

          Если `ANDROID_KEYSTORE_PATH` не задан, release APK собирается без подписи.

          ## Секреты GitHub Actions

          Откройте `Settings → Secrets and variables → Actions` и добавьте:

          - `ANDROID_KEYSTORE_BASE64`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_PASSWORD`

          Для `ANDROID_KEYSTORE_BASE64` используется Base64-представление release-keystore.

          ## Выпуск версии

          1. Обновите `versionCode` и `versionName` в `app/build.gradle`.
          2. Слейте изменения в `main`.
          3. Создайте тег вида `v1.3.3`.
          4. Workflow `Release APK` соберёт подписанный APK и создаст GitHub Release.

          Все версии, которые должны устанавливаться поверх уже установленного приложения, необходимо подписывать одним и тем же release-ключом.
          EOF
          sed -i 's/^          //' docs/BUILD_AND_RELEASE.md

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
          def keystoreAlias = System.getenv('ANDROID_KEY_ALIAS')
          def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
          def keyPassword = System.getenv('ANDROID_KEY_PASSWORD')

          android {
              namespace 'ru.dzenprep.texteditor'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.dzenprep.texteditor'
                  minSdk 24
                  targetSdk 35
                  versionCode 15
                  versionName '1.3.2'
              }

              signingConfigs {
                  release {
                      if (keystorePath) {
                          storeFile file(keystorePath)
                          storePassword keystorePassword
                          keyAlias keystoreAlias
                          keyPassword keyPassword
                      }
                  }
              }

              buildTypes {
                  release {
                      if (keystorePath) signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          sed -i 's/^          //' app/build.gradle

          cat > .github/workflows/android-ci.yml <<'EOF'
          name: Android CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Accept Android SDK licenses
                  run: yes | sdkmanager --licenses >/dev/null || true
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.10.2'
                - name: Build debug and release
                  run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
                - uses: actions/upload-artifact@v4
                  with:
                    name: Dzen-Text-CI-APKs
                    path: |
                      app/build/outputs/apk/debug/app-debug.apk
                      app/build/outputs/apk/release/app-release-unsigned.apk
          EOF
          sed -i 's/^          //' .github/workflows/android-ci.yml

          cat > .github/workflows/release.yml <<'EOF'
          name: Release APK

          on:
            push:
              tags: ['v*']

          permissions:
            contents: write

          jobs:
            release:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Accept Android SDK licenses
                  run: yes | sdkmanager --licenses >/dev/null || true
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.10.2'
                - name: Restore signing keystore
                  env:
                    ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  run: |
                    test -n "$ANDROID_KEYSTORE_BASE64"
                    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dzen-text-release.jks"
                - name: Build signed release APK
                  env:
                    ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dzen-text-release.jks
                    ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                    ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  run: gradle --no-daemon :app:assembleRelease
                - name: Verify signature
                  run: |
                    APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
                    "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
                - name: Prepare release asset
                  run: cp app/build/outputs/apk/release/app-release.apk "Dzen-Text-${GITHUB_REF_NAME}.apk"
                - name: Create GitHub Release
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: gh release create "$GITHUB_REF_NAME" "Dzen-Text-${GITHUB_REF_NAME}.apk" --generate-notes --title "Дзен Текст ${GITHUB_REF_NAME}"
          EOF
          sed -i 's/^          //' .github/workflows/release.yml

      - name: Commit imported project
        shell: bash
        working-directory: dest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle gradle.properties settings.gradle .gitignore THIRD_PARTY_NOTICES.md licenses docs .github/workflows/android-ci.yml .github/workflows/release.yml
          git commit -m "Import Android application v1.3.2"
          git push origin main
