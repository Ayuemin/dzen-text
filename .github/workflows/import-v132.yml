name: Import Dzen Text v1.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v132.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Checkout temporary source branch
        uses: actions/checkout@v4
        with:
          repository: Ayuemin/Clickhack-Studio
          ref: dzen-text-v1.3-build
          path: source

      - name: Reconstruct Dzen Text v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dzen-src
          cat source/dzen-build/src.b64.part* | base64 -d | tar -xzf - -C /tmp/dzen-src
          PROJECT=/tmp/dzen-src/Dzen-Text-source-v1.3
          test -f "$PROJECT/settings.gradle"
          curl -fL --retry 3 https://raw.githubusercontent.com/egorkaru/synonym_dictionary/master/dictionary.json -o /tmp/abramov.json
          python3 source/dzen-build/patch-v131.py "$PROJECT" /tmp/abramov.json
          (cd "$PROJECT" && patch -p1 < "$GITHUB_WORKSPACE/source/dzen-build/v132.patch")
          grep -q "versionName '1.3.2'" "$PROJECT/app/build.gradle"
          test -s "$PROJECT/app/src/main/assets/synonyms_compact.json"
          find "$PROJECT/app" -name '*.orig' -delete

          rm -rf dest/app
          cp -a "$PROJECT/app" dest/app
          cp "$PROJECT/build.gradle" "$PROJECT/gradle.properties" "$PROJECT/settings.gradle" dest/

      - name: Add repository support files
        shell: bash
        working-directory: dest
        run: |
          set -euo pipefail
          mkdir -p docs licenses

          cat > .gitignore <<'EOF'
          .gradle/
          .idea/
          *.iml
          local.properties
          /build/
          **/build/
          .cxx/
          .externalNativeBuild/
          captures/
          *.jks
          *.keystore
          keystore.properties
          .DS_Store
          Thumbs.db
          EOF
          sed -i 's/^          //' .gitignore

          cat > THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-party notices

          ## Russian synonym dictionary

          The application bundles a compact derivative of the open-source repository `egorkaru/synonym_dictionary`.

          - Repository author/copyright holder: Egor Rudinsky
          - License: MIT
          - Dictionary content: based on N. Abramov's Russian synonym dictionary

          The original repository's MIT license is preserved in `licenses/synonym_dictionary-MIT.txt`.
          The bundled runtime file is `app/src/main/assets/synonyms_compact.json`.
          EOF
          sed -i 's/^          //' THIRD_PARTY_NOTICES.md

          cat > licenses/synonym_dictionary-MIT.txt <<'EOF'
          MIT License

          Copyright (c) 2017 Egor Rudinsky

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          sed -i 's/^          //' licenses/synonym_dictionary-MIT.txt

          cat > docs/BUILD_AND_RELEASE.md <<'EOF'
          # Сборка и выпуск APK

          Нужны Java 17, Android SDK 35 и Gradle 8.10.x.

          ```bash
          gradle :app:assembleDebug
          gradle :app:assembleRelease
          ```

          Release-ключ нельзя хранить в репозитории. Проект читает параметры подписи из переменных окружения:

          - `ANDROID_KEYSTORE_PATH`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_PASSWORD`

          Для автоматических GitHub Releases добавьте в `Settings → Secrets and variables → Actions`:

          - `ANDROID_KEYSTORE_BASE64`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_PASSWORD`

          Перед выпуском обновите `versionCode` и `versionName`, затем создайте тег вида `v1.3.3`.
          Все обновления установленного приложения должны подписываться тем же release-ключом.
          EOF
          sed -i 's/^          //' docs/BUILD_AND_RELEASE.md

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
          def keystoreAlias = System.getenv('ANDROID_KEY_ALIAS')
          def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
          def keyPassword = System.getenv('ANDROID_KEY_PASSWORD')

          android {
              namespace 'ru.dzenprep.texteditor'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.dzenprep.texteditor'
                  minSdk 24
                  targetSdk 35
                  versionCode 15
                  versionName '1.3.2'
              }

              signingConfigs {
                  release {
                      if (keystorePath) {
                          storeFile file(keystorePath)
                          storePassword keystorePassword
                          keyAlias keystoreAlias
                          keyPassword keyPassword
                      }
                  }
              }

              buildTypes {
                  release {
                      if (keystorePath) signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          sed -i 's/^          //' app/build.gradle

      - name: Commit imported project
        shell: bash
        working-directory: dest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle gradle.properties settings.gradle .gitignore THIRD_PARTY_NOTICES.md licenses docs
          git commit -m "Import Android application v1.3.2"
          git push origin main
