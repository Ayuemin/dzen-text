name: Implement Dzen Text v1.4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-v141.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.4.1 patch
        run: python3 .github/scripts/v141_patch.py

      - name: Check JavaScript and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/dzen.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dzen.js
          grep -q "versionCode 20" app/build.gradle
          grep -q "versionName '1.4.1'" app/build.gradle
          grep -q "openRepeatNavigator" app/src/main/assets/www/index.html
          grep -q "closeSettings" app/src/main/assets/www/index.html
          grep -q "closeAnalysis" app/src/main/assets/www/index.html

      - name: Commit and tag v1.4.1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/www/index.html
          git commit -m "Close sheets cleanly and navigate repeated occurrences (v1.4.1)"
          git push origin main
          git tag -a v1.4.1 -m "Дзен Текст v1.4.1 — закрытие панелей и навигация повторов"
          git push origin v1.4.1
