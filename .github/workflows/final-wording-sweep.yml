name: Final terminology sweep

on:
  push:
    branches:
      - fix/ai-check-workflow-audit
    paths:
      - .github/workflows/final-wording-sweep.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-check-workflow-audit
          fetch-depth: 0

      - name: Fix and verify retired terminology
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets/www')
          index=root/'index.html'
          s=index.read_text(encoding='utf-8')
          old='<div class="smallNote" id="analysisExportNote">Отчёт соответствует выбранному режиму проверки.</div>'
          new='<div class="smallNote" id="analysisExportNote">Отчёт содержит текущие локальные замечания и ещё актуальные замечания последней ручной AI-проверки.</div>'
          if old not in s:
              raise SystemExit('old analysis export note not found')
          index.write_text(s.replace(old,new,1),encoding='utf-8')

          html=index.read_text(encoding='utf-8')
          js='\n'.join(p.read_text(encoding='utf-8') for p in (root/'js').glob('*.js'))
          css='\n'.join(p.read_text(encoding='utf-8') for p in (root/'css').glob('*.css'))
          for phrase in ['Режим проверки','Локальная проверка Дзена','AI-проверка Дзена','Панель Markdown над клавиатурой','выбранному режиму проверки']:
              if phrase in html or phrase in js:
                  raise SystemExit('retired visible wording remains: '+phrase)
          for marker in ['dzenCheckMode','markdownToolbarSwitch','normalizeDzenCheckMode','checkModeUsesLocal','checkModeUsesAi']:
              if marker in html or marker in js:
                  raise SystemExit('retired active marker remains: '+marker)
          if 'markdownToolbar' in html or 'markdownToolbar' in css:
              raise SystemExit('obsolete Markdown toolbar source/CSS remains')
          if (root/'js/12-markdown-toolbar.js').exists():
              raise SystemExit('obsolete toolbar JS still exists')
          if not (root/'js/12-workflow-policy.js').exists():
              raise SystemExit('workflow policy module missing')
          print('Final terminology/source sweep OK')
          PY

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
          python3 tools/check_editor_invariants.py
          python3 tools/check_app_logic.py
          node tools/test_publish_export.js
          node tools/test_publish_copy.js
          node tools/test_ai_dzen_flow.js

      - name: Commit sweep and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-wording-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish terminology cleanup"
          git push origin HEAD:fix/ai-check-workflow-audit
