name: Implement Dzen Text v1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-v140.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch application
        run: python3 .github/scripts/v140_patch.py

      - name: Check JavaScript and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/dzen-v140.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dzen-v140.js
          grep -q "versionCode 19" app/build.gradle
          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q "toggleAnalysisCollapse" app/src/main/assets/www/index.html
          grep -q "analyzeRepeatedPhrases" app/src/main/assets/www/index.html
          grep -q "analyzeDzenRules" app/src/main/assets/www/index.html
          grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml

      - name: Commit and tag v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/www/index.html rules/dzen-rules.json
          git commit -m "Expand editorial analysis and add Dzen rules checker (v1.4.0)"
          git push origin main
          git tag -a v1.4.0 -m "Дзен Текст v1.4.0 — расширенный анализ и правила Дзена"
          git push origin v1.4.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dzen-text-release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dzen-text-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          NORMALIZED=$(printf '%s' "$CERT_INFO" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "$NORMALIZED" | grep -q '0fd2d2518979f8db3ff5ccd6da29669a3e8de10fbcc35156de8396d3dba3f2b2'

      - name: Publish v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Dzen-Text-v1.4.0.apk
          NOTES='В анализ добавлены сворачивание панели, режимы Только проблемы / Всё / Правила Дзена, повторяющиеся фразы, одинаковые начала предложений и абзацев, структура H1–H3 и проверка Markdown. Добавлена отдельная осторожная проверка возможных рисков по требованиям Дзена с обновляемой базой правил из репозитория. Совпадения не считаются автоматическим подтверждением нарушения.'
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 Dzen-Text-v1.4.0.apk --clobber
          else
            gh release create v1.4.0 Dzen-Text-v1.4.0.apk --title "Дзен Текст v1.4.0" --notes "$NOTES"
          fi
