name: Port local publication subsystem

on:
  push:
    branches:
      - local-first-v1.9

permissions:
  contents: write

jobs:
  port:
    if: github.event.head_commit.message != 'Port proven local publication subsystem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local-first-v1.9
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply publication port
        run: python3 .github/scripts/port_local_publish.py

      - name: Validate publication behaviour
        run: |
          git diff --check
          node --check app/src/main/assets/www/js/02-text-tools.js
          node --check app/src/main/assets/www/js/09-editor.js
          node --check app/src/main/assets/www/js/12-publish.js
          node tools/test_publish_export.js
          node tools/test_publish_copy.js
          python3 tools/check_local_first.py

      - name: Commit publication port
        run: |
          if git diff --quiet; then
            echo 'No publication changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/dzenprep/texteditor/MainActivity.java \
                  app/src/main/assets/www/index.html \
                  app/src/main/assets/www/js/01-core.js \
                  app/src/main/assets/www/js/02-text-tools.js \
                  app/src/main/assets/www/js/07-spelling.js \
                  app/src/main/assets/www/js/09-editor.js \
                  app/src/main/assets/www/js/12-bootstrap.js \
                  app/src/main/assets/www/js/12-history.js \
                  app/src/main/assets/www/js/12-publish.js \
                  .github/workflows/android-ci.yml \
                  tools/check_local_first.py \
                  tools/test_publish_export.js \
                  tools/test_publish_copy.js
          git commit -m 'Port proven local publication subsystem'
          git push origin HEAD:local-first-v1.9
