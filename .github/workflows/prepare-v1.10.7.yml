name: Prepare v1.10.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-v1.10.7.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Bump application version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = [
              (Path('app/build.gradle'), "versionCode 45", "versionCode 46"),
              (Path('app/build.gradle'), "versionName '1.10.6'", "versionName '1.10.7'"),
              (Path('app/src/main/assets/www/index.html'), '<title>Дзен Текст 1.10.6</title>', '<title>Дзен Текст 1.10.7</title>'),
              (Path('app/src/main/assets/www/js/12-bootstrap.js'), "document.title='Дзен Текст 1.10.6';", "document.title='Дзен Текст 1.10.7';"),
          ]

          cache = {}
          for path, old, new in changes:
              text = cache.get(path)
              if text is None:
                  text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              cache[path] = text.replace(old, new, 1)

          for path, text in cache.items():
              path.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          index = Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          boot = Path('app/src/main/assets/www/js/12-bootstrap.js').read_text(encoding='utf-8')
          assert "versionCode 46" in gradle
          assert "versionName '1.10.7'" in gradle
          assert '<title>Дзен Текст 1.10.7</title>' in index
          assert "document.title='Дзен Текст 1.10.7';" in boot
          print('v1.10.7 version sources prepared')
          PY
          node --check app/src/main/assets/www/js/12-bootstrap.js

      - name: Commit version sources and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v1.10.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v1.10.7 sources"
          git push origin HEAD:main
