name: Fix local UI residue

on:
  push:
    branches:
      - local-first-v1.9

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Fix local UI residue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local-first-v1.9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply cleanup
        run: python3 .github/scripts/fix_local_ui_residue.py

      - name: Validate editor
        run: |
          git diff --check
          for file in app/src/main/assets/www/js/*.js; do node --check "$file"; done
          python3 tools/check_local_first.py
          python3 tools/check_app_logic.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No local UI cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/www/index.html \
                  app/src/main/assets/www/js/11-ui.js \
                  tools/check_local_first.py
          git commit -m 'Fix local UI residue'
          git push origin HEAD:local-first-v1.9
