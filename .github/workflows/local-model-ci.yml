name: Local Model CI

on:
  push:
    branches:
      - prototype/editorial-rule-packs
    paths:
      - tools/train_local_classifier.py
      - .github/workflows/local-model-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/train_local_classifier.py
      - .github/workflows/local-model-ci.yml
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'onnx>=1.16,<2' 'onnxruntime>=1.18,<2'

      - name: Train and verify starter model
        run: python tools/train_local_classifier.py --out build/local-model

      - name: Show evaluation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/local-model/evaluation.json').read_text(encoding='utf-8'))
          print('Training examples:',data['training_examples'])
          print('Smoke:',data['smoke']['exact_matches'],'/',data['smoke']['cases'])
          for label,m in data['validation_metrics'].items():
              print(label,'threshold',m['threshold'],'precision',m['precision'],'recall',m['recall'],'f1',m['f1'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Local-Text-Classifier-starter-v1
          path: |
            build/local-text-classifier-starter-v1.zip
            build/local-model/evaluation.json
          if-no-files-found: error
