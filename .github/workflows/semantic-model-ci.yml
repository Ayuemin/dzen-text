name: Semantic Model CI

on:
  push:
    branches:
      - prototype/editorial-rule-packs
    paths:
      - 'tools/export_rubert_nli.py'
      - '.github/workflows/semantic-model-ci.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' 'transformers==4.46.3' 'onnx==1.17.0' 'onnxruntime==1.20.1' 'numpy<2.1'
      - name: Export and smoke-test NLI model
        run: python tools/export_rubert_nli.py
      - name: Upload Android model package
        uses: actions/upload-artifact@v4
        with:
          name: RuBERT-tiny-NLI-Android
          path: |
            build/rubert-tiny-nli-android.zip
            build/local-nli/smoke_scores.json
          if-no-files-found: error
