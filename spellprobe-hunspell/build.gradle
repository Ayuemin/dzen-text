plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ayuemin.texteditor.spellprobe.hunspell'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ayuemin.texteditor.spellprobe.hunspell'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-hunspell-probe'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
